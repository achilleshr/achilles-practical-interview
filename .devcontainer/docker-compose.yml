name: achilles-interview-infrastructure

services:
  postgres:
    image: 'postgres:16'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5433:5432'
    volumes:
      - /var/lib/postgresql/data   # ephemeral DB
    restart: always

  node:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
      - pnpm-store:/home/node/.pnpm-store   # <- persistent store
    command: sleep infinity
    depends_on:
      - postgres

volumes:
  pnpm-store:
