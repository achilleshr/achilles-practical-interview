name: achilles-interview-infrastructure

services:
  postgres:
    image: 'postgres:16'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5433:5432'
    volumes:
      - ${HOME}/.achilles-interview/dbdata:/var/lib/postgresql/data
    restart: always
